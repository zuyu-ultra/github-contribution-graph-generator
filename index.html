<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kusa</title>
    <meta name="description" content="Customise your GitHub contribution graph. Backfill commits on any past date, or draw words and images into the grid, then export a Bash script you can read before running." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kusa" />
    <meta property="og:description" content="Customise your GitHub contribution graph — backfill past commits, or draw words and images into the grid. Runs entirely in your browser." />
    <meta name="twitter:card" content="summary" />

    <script>
      // Paint the right background before React mounts, so there is no flash.
      try {
        var saved = JSON.parse(localStorage.getItem('contribution-studio/v1') || '{}').theme
        var resolved = saved && saved !== 'system'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = resolved
      } catch (error) { /* keep the default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
