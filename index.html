<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Draw a GitHub contribution graph and export a reviewable Bash script. Runs entirely in your browser." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>GitHub Contribution Studio</title>
    <script>
      // Paint the right background before React mounts, so there is no flash.
      try {
        var saved = JSON.parse(localStorage.getItem('contribution-studio/v1') || '{}').theme
        var resolved = saved && saved !== 'system'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = resolved
      } catch (error) { /* keep the default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
